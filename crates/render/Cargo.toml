[package]
name = "faset-render"
description = "Vulkan renderer: device, swapchain, frame loop, offscreen target."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
