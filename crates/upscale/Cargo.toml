[package]
name = "faset-upscale"
description = "Upscalers of the renderer: the Upscaler trait, render scale, temporal anti-aliasing, FSR 1 and FSR 3 (runtime-loaded)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fsr3"]
# FSR 3 through AMD's FidelityFX API library, loaded at runtime (Windows x86_64).
fsr3 = ["dep:libloading"]

[dependencies]
faset-render.workspace = true
faset-shaders.workspace = true
thiserror.workspace = true
tracing.workspace = true
ash = "0.38"
bytemuck = { version = "1.25", features = ["derive"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
libloading = { version = "0.8", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
