[package]
name = "faset-ui"
description = "egui interface: pass 9 paint backend on Vulkan, theme, translation table and debug overlay."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
faset-core.workspace = true
faset-render.workspace = true
faset-shaders.workspace = true
faset-minigame-api.workspace = true
thiserror.workspace = true
tracing.workspace = true
ash = "0.38"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
puffin = "0.20"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
