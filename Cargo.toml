[workspace]
resolver = "2"
members = ["xtask", "probe", "crates/core", "crates/protocol", "crates/sim", "crates/net", "crates/render", "crates/server", "crates/shaders", "crates/client"]

[workspace.package]
version = "0.0.1-rc.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
glam = "0.33"
thiserror = "2"
tracing = "0.1"
proptest = "1"
faset-core = { path = "crates/core", version = "0.0.1-rc.1" }
faset-protocol = { path = "crates/protocol", version = "0.0.1-rc.1" }
faset-sim = { path = "crates/sim", version = "0.0.1-rc.1" }
faset-net = { path = "crates/net", version = "0.0.1-rc.1" }
faset-shaders = { path = "crates/shaders", version = "0.0.1-rc.1" }
faset-server = { path = "crates/server", version = "0.0.1-rc.1" }
