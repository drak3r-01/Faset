services:
  dev:
    build:
      context: .
      target: dev
    image: faset-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/cache/target
      - sccache:/cache/sccache
      - xwin:/cache/xwin
    tty: false

  # Dedicated server image (`dev.ps1 run-server`): no graphics dependency.
  server:
    build:
      context: .
      target: server-runtime
    image: faset-server
    ports:
      - "7777:7777/udp"
    stdin_open: true
    tty: true

volumes:
  cargo-registry:
  cargo-git:
  target:
  sccache:
  xwin:
