services:
  dev:
    build:
      context: .
      target: dev
    image: faset-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/cache/target
      - sccache:/cache/sccache
      - xwin:/cache/xwin
    tty: false

volumes:
  cargo-registry:
  cargo-git:
  target:
  sccache:
  xwin:
