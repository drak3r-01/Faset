[advisories]
version = 2
# paste is unmaintained but only used (at build time) by kira; no safe upgrade exists.
# Decision (Gabriel): keep kira and keep this ignore. TODO: re-check and remove the
# ignore once kira drops its `paste` dependency.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
# MPL-2.0: triple_buffer (kira), file-level copyleft, used unmodified.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
